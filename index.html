<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Management-System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>Student Management System</h1>
        <div class="button">
            <button onclick="getStudents()">Get Students</button>
            <button onclick="getStudent(id)">Get Student</button>
            <button onclick="addStudent()">Add Student</button>
            <button onclick="updateStudent(id)">Update Student by ID</button>
            <button onclick="updateStudentCity(id)">Update Student City by id</button>
            <button onclick="deleteStudent(id)">Delete Student by id</button>
            <button onclick="searchStudent(name)">Search Student by Name</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
